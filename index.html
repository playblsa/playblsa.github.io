<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BLSA End of Year Tournament — Live Schedule</title>
<style>
:root{
  --hero:#081849;
  --hero-dark:#050F2E;
  --cream:#ECDFD2;
  --lapis:#213885;
  --plum:#5F3475;
  --accent:#893172;
  --muted:#7A7482;
  --dark-muted:#C7BFC9;
  --line:#CCCACC;
  --ink:#081849;
  --f-display: -apple-system, "Helvetica Neue", Arial, sans-serif;
  --f-body: -apple-system, system-ui, "Segoe UI", Arial, sans-serif;
  --f-mono: ui-monospace, "SF Mono", "Cascadia Code", "Courier New", monospace;
}
*{box-sizing:border-box;}
body{margin:0;background:var(--cream);color:var(--ink);font-family:var(--f-body);}
.app{max-width:900px;margin:0 auto;padding-bottom:48px;}

.topbar{background:linear-gradient(155deg,var(--hero),var(--hero-dark));
  color:var(--cream);padding:22px 20px 18px;position:sticky;top:0;z-index:5;
  box-shadow:0 2px 10px rgba(0,0,0,.15);}
.topbar .eyebrow{color:var(--cream);font-weight:700;font-size:11.5px;letter-spacing:.09em;
  font-family:var(--f-display);}
.topbar h1{margin:2px 0 4px;font-size:26px;letter-spacing:-.01em;font-family:var(--f-display);
  font-weight:800;}

.controls{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:14px 20px 0;}
.controls select, .controls .btn{
  font-family:var(--f-body);font-size:14px;padding:9px 12px;border-radius:8px;
  border:1.5px solid var(--line);background:#fff;color:var(--ink);
}
.controls label{font-size:11px;color:var(--muted);font-weight:700;letter-spacing:.05em;
  text-transform:uppercase;display:block;margin-bottom:3px;}
.field{display:flex;flex-direction:column;}
.day-tabs{display:flex;gap:6px;}
.day-tabs button{border:1.5px solid var(--line);background:#fff;color:var(--ink);
  padding:9px 14px;border-radius:8px;font-size:13.5px;font-weight:700;cursor:pointer;
  font-family:var(--f-body);}
.day-tabs button.active{background:var(--hero);color:var(--cream);border-color:var(--hero);}

.legend-row{display:flex;flex-wrap:wrap;gap:14px;align-items:center;padding:12px 20px 0;
  font-size:12px;color:var(--muted);}
.legend-row .chip{display:inline-flex;align-items:center;gap:6px;font-weight:600;}
.diamond-mark{width:10px;height:10px;transform:rotate(45deg);display:inline-block;flex:none;}
.round-badge{width:17px;height:17px;border-radius:50%;display:inline-flex;align-items:center;
  justify-content:center;font-size:10px;font-weight:800;font-family:var(--f-display);flex:none;}

main{padding:14px 20px 0;}

.day-divider{background:var(--hero);color:var(--cream);font-family:var(--f-display);
  font-weight:800;font-size:13px;letter-spacing:.06em;padding:8px 12px;border-radius:6px;
  margin:16px 0 8px;}
.day-divider:first-child{margin-top:0;}

.slot-card{border:1.5px solid var(--line);border-radius:10px;background:#fff;margin-bottom:10px;
  overflow:hidden;}
.slot-time{font-family:var(--f-mono);font-weight:700;color:var(--lapis);font-size:13.5px;
  padding:10px 14px 0;}
.slot-games{display:grid;grid-template-columns:1fr;gap:0;}
@media(min-width:640px){.slot-games.two-col{grid-template-columns:1fr 1fr;}}
.game-half{padding:8px 14px 12px;}
.game-half + .game-half{border-top:1px solid var(--line);}
@media(min-width:640px){
  .slot-games.two-col .game-half + .game-half{border-top:none;border-left:1px solid var(--line);}
}
.diamond-label{display:flex;align-items:center;gap:6px;font-size:10.5px;font-weight:800;
  color:var(--muted);letter-spacing:.05em;margin-bottom:4px;}
.matchup{font-family:var(--f-display);font-weight:800;font-size:18px;}
.matchup.final-matchup .winner{color:var(--lapis);}
.matchup .score-dash{color:var(--muted);font-weight:400;margin:0 3px;}
.final-tag{display:inline-block;background:var(--accent);color:var(--cream);font-family:var(--f-display);
  font-size:9.5px;font-weight:800;letter-spacing:.05em;padding:2px 7px;border-radius:4px;
  margin-left:8px;vertical-align:middle;}
.result-tag{display:inline-block;font-family:var(--f-display);font-size:9.5px;font-weight:800;
  letter-spacing:.05em;padding:2px 7px;border-radius:4px;margin-left:8px;vertical-align:middle;}
.result-tag.win{background:var(--lapis);color:var(--cream);}
.result-tag.loss{background:var(--muted);color:var(--cream);}
.result-tag.tie{background:var(--accent);color:var(--cream);}
.sub{font-size:11.5px;color:var(--muted);margin-top:1px;}
.duty-line{display:flex;align-items:center;gap:7px;font-size:12.5px;margin-top:8px;}
.beer-strip{border-top:1px dashed var(--line);padding:9px 14px;display:flex;align-items:center;
  gap:7px;font-size:12.5px;justify-content:center;background:#F5EFE6;}

.special-row{border-radius:10px;margin-bottom:10px;padding:16px;text-align:center;}
.special-row.muted{background:#E4DACD;color:var(--ink);font-style:italic;}
.special-row.playoff{background:var(--hero);color:var(--cream);}
.special-row.playoff .ptime{font-family:var(--f-mono);color:var(--cream);font-size:13px;text-align:left;}
.special-row.playoff .plabel{font-family:var(--f-display);font-weight:800;font-size:22px;margin:6px 0 4px;}
.special-row.playoff .psub{font-size:11.5px;color:var(--dark-muted);}

.team-entry{border:1.5px solid var(--line);border-radius:10px;background:#fff;margin-bottom:9px;
  padding:10px 14px 12px;}
.team-entry .toprow{display:flex;justify-content:space-between;align-items:baseline;}
.team-entry .time{font-family:var(--f-mono);font-weight:700;color:var(--lapis);font-size:13px;}
.team-entry .dloc{font-size:10px;color:var(--muted);font-weight:800;letter-spacing:.04em;}
.team-entry .body{display:flex;align-items:center;gap:10px;margin-top:6px;}
.team-entry .title{font-family:var(--f-display);font-weight:800;font-size:17px;}
.team-entry .desc{font-size:11.5px;color:var(--muted);margin-top:1px;}

.ref-card{border:1.5px solid var(--line);border-radius:10px;background:#fff;margin-bottom:14px;
  padding:16px 18px;}
.ref-card h2{margin:0 0 2px;font-family:var(--f-display);font-size:17px;color:var(--lapis);}
.ref-card .ref-sub{font-size:12px;color:var(--muted);font-style:italic;margin-bottom:10px;}
.price-row{display:flex;justify-content:space-between;gap:10px;padding:6px 0;
  border-bottom:1px dotted var(--line);font-size:14px;}
.price-row:last-child{border-bottom:none;}
.price-row .pname{color:var(--ink);}
.price-row .pprice{font-weight:700;color:var(--ink);white-space:nowrap;}
.ref-note{font-size:11.5px;color:var(--muted);font-style:italic;margin-top:10px;}
.rules-section h3{font-family:var(--f-display);font-size:14px;color:var(--lapis);
  margin:14px 0 6px;}
.rules-section h3:first-child{margin-top:0;}
.rules-section p{font-size:12.5px;line-height:1.5;color:var(--ink);margin:0 0 8px;}

.standings-table{width:100%;border-collapse:collapse;font-size:14px;}
.standings-table th{font-size:10.5px;font-weight:800;color:var(--muted);letter-spacing:.05em;
  text-align:center;padding:4px 4px 6px;border-bottom:1.5px solid var(--line);}
.standings-table th.team-col{text-align:left;}
.standings-table td{padding:8px 4px;text-align:center;border-bottom:1px dotted var(--line);
  font-variant-numeric:tabular-nums;}
.standings-table tr:last-child td{border-bottom:none;}
.standings-table td.team-col{text-align:left;font-family:var(--f-display);font-weight:700;}
.standings-table td.rank{width:18px;color:var(--muted);font-weight:700;font-size:12px;}
.standings-table td.pts{font-weight:800;color:var(--lapis);}
.standings-table tr.final-spot td.team-col{color:var(--lapis);}
.standings-table tr.final-spot td.rank{color:var(--cream);}
.standings-table tr.final-spot td.rank span{background:var(--lapis);border-radius:50%;
  display:inline-flex;width:18px;height:18px;align-items:center;justify-content:center;}
.hidden{display:none !important;}
</style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <div class="eyebrow">BLSA END OF YEAR TOURNAMENT</div>
    <h1>Live Schedule</h1>
  </div>

  <div class="controls">
    <div class="field">
      <label for="teamSelect">View</label>
      <select id="teamSelect"></select>
    </div>
    <div class="field" id="dayTabsWrap">
      <label>Day</label>
      <div class="day-tabs" id="dayTabs"></div>
    </div>
  </div>

  <div class="legend-row">
    <span class="chip"><span class="diamond-mark" style="background:var(--lapis)"></span>Diamond 1</span>
    <span class="chip"><span class="diamond-mark" style="background:var(--plum)"></span>Diamond 2</span>
    <span class="chip"><span class="round-badge" style="background:var(--lapis);color:var(--cream)">S</span>Scorekeeping (2 players)</span>
    <span class="chip"><span class="round-badge" style="background:var(--accent);color:var(--cream)">B</span>Beer tent (2 players)</span>
  </div>

  <main id="content"></main>
</div>

<script>
const DATA = {"slots": [{"id": "FRI1", "day": "Friday", "start": "6:15 PM", "end": "8:00 PM", "kind": "game", "d1": ["A1", "A6"], "d2": ["B1", "B6"], "score1": "B5", "score2": "A5", "beer": null, "result1": [22, 6], "result2": [22, 13]}, {"id": "FRI2", "day": "Friday", "start": "8:00 PM", "end": "9:45 PM", "kind": "game", "d1": ["A2", "A5"], "d2": ["B2", "B5"], "score1": "B6", "score2": "A6", "beer": null, "result1": [16, 6], "result2": [16, 16]}, {"id": "FRI-BUF", "day": "Friday", "start": "9:45 PM", "end": "10:00 PM", "kind": "buffer", "label": "Unused \u2014 15 min buffer"}, {"id": "SAT1", "day": "Saturday", "start": "8:00 AM", "end": "9:45 AM", "kind": "game", "d1": ["A3", "A6"], "d2": ["B3", "B6"], "score1": "B1", "score2": "A1", "beer": null, "result1": null, "result2": [15, 10]}, {"id": "SAT2", "day": "Saturday", "start": "9:45 AM", "end": "11:30 AM", "kind": "game", "d1": ["A2", "A4"], "d2": ["B2", "B4"], "score1": "B3", "score2": "A3", "beer": "A3", "result1": null, "result2": null}, {"id": "SAT-LUNCH", "day": "Saturday", "start": "11:30 AM", "end": "1:00 PM", "kind": "lunch", "label": "Lunch Break", "beer": "A5"}, {"id": "SAT3", "day": "Saturday", "start": "1:00 PM", "end": "2:45 PM", "kind": "game", "d1": ["A1", "A3"], "d2": ["B1", "B3"], "score1": "B2", "score2": "A2", "beer": "B2", "result1": null, "result2": null}, {"id": "SAT4", "day": "Saturday", "start": "2:45 PM", "end": "4:30 PM", "kind": "game", "d1": ["A4", "A5"], "d2": ["B4", "B5"], "score1": "B6", "score2": "A6", "beer": "A6", "result1": null, "result2": null}, {"id": "SAT5", "day": "Saturday", "start": "4:30 PM", "end": "6:15 PM", "kind": "game", "d1": ["A2", "A3"], "d2": ["B2", "B3"], "score1": "B5", "score2": "A5", "beer": "B5", "result1": null, "result2": null}, {"id": "SAT6", "day": "Saturday", "start": "6:15 PM", "end": "8:00 PM", "kind": "game", "d1": ["A5", "A6"], "d2": ["B5", "B6"], "score1": "B4", "score2": "A4", "beer": "A4", "result1": null, "result2": null}, {"id": "SAT7", "day": "Saturday", "start": "8:00 PM", "end": "9:45 PM", "kind": "game", "d1": ["A1", "A4"], "d2": ["B1", "B4"], "score1": "B3", "score2": "A3", "beer": "B3", "result1": null, "result2": null}, {"id": "SAT-BUF", "day": "Saturday", "start": "9:45 PM", "end": "10:00 PM", "kind": "buffer", "label": "Unused \u2014 15 min buffer"}, {"id": "SUN1", "day": "Sunday", "start": "9:30 AM", "end": "11:15 AM", "kind": "game", "d1": ["A2", "A6"], "d2": ["B2", "B6"], "score1": "B4", "score2": "A4", "beer": "B4", "result1": null, "result2": null}, {"id": "SUN2", "day": "Sunday", "start": "11:15 AM", "end": "1:00 PM", "kind": "game", "d1": ["A1", "A5"], "d2": ["B1", "B5"], "score1": "B2", "score2": "A2", "beer": "A2", "result1": null, "result2": null}, {"id": "SUN3", "day": "Sunday", "start": "1:00 PM", "end": "2:45 PM", "kind": "game", "d1": ["A4", "A3"], "d2": ["B4", "B3"], "score1": "B1", "score2": "A1", "beer": "B1", "result1": null, "result2": null}, {"id": "SUN-BUF", "day": "Sunday", "start": "2:45 PM", "end": "3:15 PM", "kind": "buffer", "label": "Buffer \u2014 rest before playoffs begin"}, {"id": "SUN-POOLB", "day": "Sunday", "start": "3:15 PM", "end": "5:15 PM", "kind": "playoff", "label": "POOL B FINAL", "score1": "EXECS", "score2": "EXECS", "beer": "A1", "teams": null, "result": null}, {"id": "SUN-POOLA", "day": "Sunday", "start": "5:15 PM", "end": "7:30 PM", "kind": "playoff", "label": "POOL A FINAL", "score1": "EXECS", "score2": "EXECS", "beer": "B6", "teams": null, "result": null}], "dayInfo": {"Friday": {"hours": "6:00 PM \u2013 10:00 PM"}, "Saturday": {"hours": "8:00 AM \u2013 10:00 PM  |  Lunch break 11:30 AM\u20131:00 PM"}, "Sunday": {"hours": "8:00 AM \u2013 8:00 PM  |  Pool play wraps by 2:45 PM \u2014 playoffs follow"}}, "teams": ["A1", "A2", "A3", "A4", "A5", "A6", "B1", "B2", "B3", "B4", "B5", "B6"], "teamNames": {"A1": "Bat-titudes", "A2": "Stealers", "A3": "Renegades", "A4": "Ice Cold Pitches", "A5": "Angels", "A6": "Big D's", "B1": "Rookies", "B2": "Swingers", "B3": "Metro Scrappers", "B4": "Dynamite Dames", "B5": "Basic Pitches", "B6": "The Misfits"}, "foodTruck": {"vendor": "Foodie LU", "tagline": "Italian inspired street food", "items": [["Mac N Cheese", "$10"], ["Pulled Pork Mac N Cheese", "$14"], ["Loaded Pulled Pork Sandwich", "$14"], ["Kids Combo (large hotdog, chips, drink)", "$10"], ["Turkey Pesto Provolone Sandwich", "$14"], ["Roasted Veggie Pesto Sandwich", "$12"], ["Oreo Cannolis", "$4"], ["Drinks", "$2"]], "note": "Plus HST. Cash payments get a free drink."}, "drinksSnacks": [["Non-Alcoholic Drinks", [["Pop", "$2.00"], ["Gatorade", "$2.50"], ["Water (500 mL)", "$1.00"], ["Water (1L)", "$2.00"], ["Corona (non-alcoholic)", "$3.00"], ["Ole (mocktail)", "$3.00"]]], ["Snacks", [["Candy", "$1.50"], ["Chocolate Bars", "$2.50"], ["Chips", "$2.50"], ["Munchies", "$1.50"], ["Double Bubble", "$0.50"]]], ["Alcoholic Drinks", [["Beer", "$4.00"], ["Coolers (including Ciders)", "$5.00"]]]], "rules": [["General Rules", ["1) There will be an A and B Division based on the standings of the league season. The outcome of the season will determine how many teams will be in each division.", "2) Teams may use up to five spares if necessary for a game. Spares can come from their own division only. Note: There will be NO allowance for delay of game should a spare be playing for another team and the game time crosses over their home team timeslot.", "3) Only rostered players may play in the tournament.", "4) 2 points will be awarded for a win, 1 point to each team for a tie, and 0 for a loss.", "5) The home team will be decided by a coin toss for each separate game.", "6) In the finals and/or semi-final (if applicable) of both the A and B divisions, the home team will be decided based on the round robin results. The team with the higher points total will be the home team.", "7) The mercy rule is not in effect.", "8) No inning may start after 90 minutes following the start of the game.", "9) A game will be considered complete in any inning after the 5th. In the event of poor weather conditions, every effort will be made to reschedule games that are not complete. If the schedule does not allow for rescheduling of all games, there will be no minimum number of innings required. Any full inning after the 1st, will be considered complete. As per the discretion of the executive.", "10) Rain delay: only for lightning and severe weather conditions making the fields unsafe. This time is not added to the time limit thereafter.", "11) Games will be won if the Home team is ahead by 1 or more runs at the end of the top of the last inning (determined by the umpire), otherwise the home team will take their bat until they are 1 run ahead (then the game is won) or there are 3 outs.", "12) For tournament only, teams will be allowed up to 5 courtesy runners.", "13) Members of the executive will score the final games.", "14) Playoff games are officiated by 1 umpire. If the umpires association is able to accommodate, there will be 2 umpires for each final game.", "15) No games shall be protested.", "16) A member of the executive should be available for each game for consultation about the rules."]], ["Umpire's Judgment", ["There shall be no appeal of any decision of either umpire on the grounds that he was not correct in his conclusion as to whether a batted ball was fair or foul, a runner was safe or out, a pitched ball was a strike or ball, or on any play involving accuracy of judgement, and no decision rendered by either umpire shall be reversed except that he be convinced it is in violation of these rules. If the captain of either team seeks a reversal of a decision based solely on a point of rules, the umpire whose decision is in question shall, if in doubt, confer with his associate before taking any action. Under no circumstances shall any player or person other than the captain of either team have any legal right to appeal any decision and seek its reversal on a claim that it is in conflict with these rules. As well, any appeals must be made before the next pitch, legal or illegal. Once the pitch is thrown, all appeals are over."]], ["Tie-Breaker \u2014 Semi-Final and/or Final Games", ["In the event of a tie after the 7th inning of play, International Rules will apply as follows: Starting with the top of the eighth inning, and each half inning thereafter, the offensive team shall begin its turn at bat with the player who is scheduled to bat last in the batting order that respective half inning being placed on second base. The player who is running can be substituted in accordance with the BLSA courtesy runner rules. If an incorrect runner in the line-up is placed on second base, this error may be corrected as soon as it is noticed. There is no penalty. (2011)"]], ["Semi-Final (if applicable) and/or Final", ["\u2022 The 2 teams in each division with the highest points total will play in the finals to determine the winners of the A and B divisions. Note: In the event of a semi-final game, the 1st place team will get a bye to the final and the 2nd and 3rd place teams will play in the semi-final, to decide who will be the 2nd team playing in the division final.", "\u2022 There is no time limit in the semi-final (if applicable) and/or Final; a full seven (7) innings will be played, unless the home team is ahead after 6 1/2 innings. The following criteria will be used to determine which teams will play in the semi-final and/or final for each division:", "1. Wins/Losses \u2013 highest point value (2 points for Win, 1 for tie, 0 for loss). If teams are still tied, then:", "2. Winners of games between tied teams (Note: In order to use this criterion, all subject tied teams must have played each other in the qualifying round). If teams did not play each other, or teams remain tied, then:", "3. Total plus or minus of runs scored, with a limit of plus 7 or minus 7 per game allowed. Note: When using this criterion, the final score of the game will be used. (2012) If teams are still tied, then;", "4. Total number of runs (no limits of plus or minus 7) for all qualifying round robin games based on equal full innings played will be used. (I.e. Team A's shortest game is 5 innings \u2013 and Team B's shortest game is 7 innings. All games of the tied teams will be reviewed based on the final scores in the 5th inning.) If teams are still tied;", "5. Finalists will be determined by a coin toss."]]]};
const DAY_ORDER = ["Friday","Saturday","Sunday"];
let teamNames = {};
DATA.teams.forEach(t => teamNames[t] = (DATA.teamNames && DATA.teamNames[t]) || t);
let currentView = "__all__";
let currentDay = "Saturday";

function td(code){ return teamNames[code] || code; }

function poolOf(code){ return code[0]; }

function buildTeamSelect(){
  const sel = document.getElementById("teamSelect");
  sel.innerHTML = "";
  const optAll = document.createElement("option");
  optAll.value = "__all__"; optAll.textContent = "Full master schedule";
  sel.appendChild(optAll);
  const optStand = document.createElement("option");
  optStand.value = "__standings__"; optStand.textContent = "Standings";
  sel.appendChild(optStand);
  const optMenu = document.createElement("option");
  optMenu.value = "__menu__"; optMenu.textContent = "Food Truck & Concession";
  sel.appendChild(optMenu);
  const optRules = document.createElement("option");
  optRules.value = "__rules__"; optRules.textContent = "Tournament Rules";
  sel.appendChild(optRules);
  const poolA = document.createElement("optgroup"); poolA.label = "Pool A";
  const poolB = document.createElement("optgroup"); poolB.label = "Pool B";
  DATA.teams.forEach(t => {
    const o = document.createElement("option");
    o.value = t; o.textContent = td(t) + (td(t)!==t ? "  ("+t+")" : "");
    (poolOf(t)==="A" ? poolA : poolB).appendChild(o);
  });
  sel.appendChild(poolA); sel.appendChild(poolB);
  sel.value = currentView;
}

function buildDayTabs(){
  const wrap = document.getElementById("dayTabs");
  wrap.innerHTML = "";
  DAY_ORDER.forEach(d => {
    const b = document.createElement("button");
    b.textContent = d;
    if(d===currentDay) b.classList.add("active");
    b.onclick = () => { currentDay = d; render(); };
    wrap.appendChild(b);
  });
}

function dutyLine(letter, bg, fg, text){
  return `<div class="duty-line"><span class="round-badge" style="background:${bg};color:${fg}">${letter}</span>${text}</div>`;
}

function matchupHtml(pair, result){
  const t1 = td(pair[0]), t2 = td(pair[1]);
  if(!result){
    return `<div class="matchup">${t1} vs ${t2}</div>`;
  }
  const r1 = result[0], r2 = result[1];
  const w1 = r1 > r2 ? "winner" : "";
  const w2 = r2 > r1 ? "winner" : "";
  return `<div class="matchup final-matchup">
    <span class="${w1}">${t1} ${r1}</span>
    <span class="score-dash">&ndash;</span>
    <span class="${w2}">${r2} ${t2}</span>
    <span class="final-tag">FINAL</span>
  </div>`;
}

function renderMasterDay(day){
  const slots = DATA.slots.filter(s => s.day === day);
  let html = "";
  slots.forEach(s => {
    if(s.kind === "game"){
      const beerHtml = s.beer ? `<div class="beer-strip">${dutyLine("B","var(--accent)","var(--cream)", "Beer tent (2 players): <strong>"+td(s.beer)+"</strong>")}</div>` : "";
      html += `<div class="slot-card">
        <div class="slot-time">${s.start} &ndash; ${s.end}</div>
        <div class="slot-games two-col">
          <div class="game-half">
            <div class="diamond-label"><span class="diamond-mark" style="background:var(--lapis)"></span>DIAMOND 1</div>
            ${matchupHtml(s.d1, s.result1)}
            ${s.score1 ? dutyLine("S","var(--lapis)","var(--cream)","Scorekeeping (2 players): <strong>"+td(s.score1)+"</strong>") : ""}
          </div>
          <div class="game-half">
            <div class="diamond-label"><span class="diamond-mark" style="background:var(--plum)"></span>DIAMOND 2</div>
            ${matchupHtml(s.d2, s.result2)}
            ${s.score2 ? dutyLine("S","var(--lapis)","var(--cream)","Scorekeeping (2 players): <strong>"+td(s.score2)+"</strong>") : ""}
          </div>
        </div>
        ${beerHtml}
      </div>`;
    } else if(s.kind === "playoff"){
      const beerHtml = s.beer ? dutyLine("B","var(--accent)","var(--cream)","Beer tent (2 players): <strong>"+td(s.beer)+"</strong>") : "";
      html += `<div class="special-row playoff">
        <div class="ptime">${s.start} &ndash; ${s.end}</div>
        <div class="plabel">${s.label}</div>
        <div class="psub">Scorekeeping: Tournament Execs</div>
        ${beerHtml ? `<div style="margin-top:8px;display:flex;justify-content:center;">${beerHtml}</div>` : ""}
      </div>`;
    } else {
      const beerHtml = s.beer ? dutyLine("B","var(--accent)","var(--cream)","Beer tent (2 players): <strong>"+td(s.beer)+"</strong>") : "";
      html += `<div class="special-row muted">
        ${s.label}
        ${beerHtml ? `<div style="margin-top:6px;display:flex;justify-content:center;font-style:normal;">${beerHtml}</div>` : ""}
      </div>`;
    }
  });
  return html;
}

function teamGames(code){
  const out = [];
  DATA.slots.forEach(s => {
    if(s.kind === "game" || s.kind === "playoff"){
      if(Array.isArray(s.d1) && s.d1.includes(code)){
        const myIdx = s.d1[0]===code ? 0 : 1;
        out.push({slot:s, role:"play", diamond:"Diamond 1", opponent: s.d1[myIdx===0?1:0], result: s.result1, myIdx});
      }
      if(Array.isArray(s.d2) && s.d2.includes(code)){
        const myIdx = s.d2[0]===code ? 0 : 1;
        out.push({slot:s, role:"play", diamond:"Diamond 2", opponent: s.d2[myIdx===0?1:0], result: s.result2, myIdx});
      }
    }
    if(s.score1 === code){ out.push({slot:s, role:"score", diamond:"Diamond 1"}); }
    if(s.score2 === code){ out.push({slot:s, role:"score", diamond:"Diamond 2"}); }
    if(s.beer === code){ out.push({slot:s, role:"beer", diamond:null}); }
  });
  return out;
}

function resultTag(myRuns, oppRuns){
  const cls = myRuns > oppRuns ? "win" : myRuns < oppRuns ? "loss" : "tie";
  const label = myRuns > oppRuns ? "WIN" : myRuns < oppRuns ? "LOSS" : "TIE";
  return `<span class="result-tag ${cls}">${label}</span>`;
}

function renderTeamView(code){
  const games = teamGames(code);
  let html = `<div style="margin-bottom:10px;">
    <span style="font-family:var(--f-display);font-weight:800;font-size:20px;">${td(code)}</span>
    <span style="font-size:12px;color:var(--muted);"> &middot; Pool ${poolOf(code)} &middot; ${games.filter(g=>g.role==='play').length} pool-play games</span>
  </div>`;
  DAY_ORDER.forEach(day => {
    const dayGames = games.filter(g => g.slot.day === day);
    if(!dayGames.length) return;
    html += `<div class="day-divider">${day}</div>`;
    dayGames.forEach(g => {
      const s = g.slot;
      let dcolor = g.diamond === "Diamond 1" ? "var(--lapis)" : g.diamond === "Diamond 2" ? "var(--plum)" : "var(--accent)";
      let letter = g.role === "play" ? "P" : g.role === "score" ? "S" : "B";
      let fg = "var(--cream)";
      let title, desc;
      if(g.role === "play"){
        if(g.result){
          const myRuns = g.result[g.myIdx], oppRuns = g.result[1-g.myIdx];
          title = `${td(code)} ${myRuns} &ndash; ${oppRuns} ${td(g.opponent)} ${resultTag(myRuns, oppRuns)}`;
          desc = (s.kind === "playoff" ? "Playoff game" : "Pool play game") + " &middot; FINAL";
        } else {
          title = `${td(code)} vs ${td(g.opponent)}`;
          desc = s.kind === "playoff" ? "Playoff game" : "Pool play game";
        }
      } else if(g.role === "score"){
        title = "Scorekeeping duty (2 players)";
        const pair = g.diamond === "Diamond 1" ? s.d1 : s.d2;
        desc = Array.isArray(pair) ? `${g.diamond}: ${td(pair[0])} vs ${td(pair[1])}` : "";
      } else {
        title = "Beer tent duty (2 players)";
        desc = "Send 2 players who aren't playing that slot";
      }
      html += `<div class="team-entry">
        <div class="toprow">
          <span class="time">${s.start} &ndash; ${s.end}</span>
          ${g.diamond ? `<span class="dloc">${g.diamond.toUpperCase()}</span>` : ""}
        </div>
        <div class="body">
          <span class="round-badge" style="background:${dcolor};color:${fg};width:24px;height:24px;font-size:12px;">${letter}</span>
          <div>
            <div class="title">${title}</div>
            <div class="desc">${desc}</div>
          </div>
        </div>
      </div>`;
    });
  });
  return html;
}

function renderMenu(){
  const ft = DATA.foodTruck;
  let html = `<div class="ref-card">
    <h2>Food Truck &mdash; ${ft.vendor}</h2>
    <div class="ref-sub">${ft.tagline}</div>
    ${ft.items.map(([name, price]) => `<div class="price-row"><span class="pname">${name}</span><span class="pprice">${price}</span></div>`).join("")}
    <div class="ref-note">${ft.note}</div>
  </div>`;
  html += `<div class="ref-card">
    <h2>Drinks &amp; Snacks</h2>
    <div class="ref-sub">2026 Price List</div>`;
  DATA.drinksSnacks.forEach(([section, items]) => {

    html += items.map(([name, price]) => `<div class="price-row"><span class="pname">${name}</span><span class="pprice">${price}</span></div>`).join("");

function renderRules(){
  let html = "";
  DATA.rules.forEach(([title, paragraphs]) => {
    html += `<div class="ref-card rules-section"><h3>${title}</h3>`;
    html += paragraphs.map(p => `<p>${p}</p>`).join("");
    html += `</div>`;
  });
  return html;
}

function poolGames(){
  const games = [];
  DATA.slots.forEach(s => {
    if(s.kind !== "game") return;
    [[s.d1, s.result1], [s.d2, s.result2]].forEach(([pair, res]) => {
      if(Array.isArray(pair) && res) games.push({a: pair[0], b: pair[1], ra: res[0], rb: res[1]});
    });
  });
  return games;
}

function computeStandings(pool){
  const games = poolGames();
  const rows = {};
  DATA.teams.filter(t => poolOf(t) === pool).forEach(t => {
    rows[t] = {team: t, gp: 0, w: 0, l: 0, t: 0, pts: 0, rf: 0, ra: 0, diff: 0};
  });
  games.forEach(g => {
    [[g.a, g.ra, g.rb], [g.b, g.rb, g.ra]].forEach(([team, f, a]) => {
      const r = rows[team]; if(!r) return;
      r.gp++; r.rf += f; r.ra += a;
      r.diff += Math.max(-7, Math.min(7, f - a));  // rule: +/- capped at 7 per game
      if(f > a){ r.w++; r.pts += 2; } else if(f < a){ r.l++; } else { r.t++; r.pts += 1; }
    });
  });
  const list = Object.values(rows);
  // Head-to-head points among a group of tied teams; only used if they all played each other.
  function h2h(group){
    const set = new Set(group.map(r => r.team)), pts = {}, met = {};
    group.forEach(r => { pts[r.team] = 0; });
    games.forEach(g => {
      if(!set.has(g.a) || !set.has(g.b)) return;
      met[[g.a, g.b].sort().join()] = true;
      if(g.ra > g.rb) pts[g.a] += 2; else if(g.rb > g.ra) pts[g.b] += 2; else { pts[g.a]++; pts[g.b]++; }
    });
    const needed = group.length * (group.length - 1) / 2;
    return Object.keys(met).length === needed ? pts : null;
  }
  const byPts = {};
  list.forEach(r => (byPts[r.pts] = byPts[r.pts] || []).push(r));
  const h2hPts = {};
  Object.values(byPts).forEach(group => {
    const h = group.length > 1 ? h2h(group) : null;
    group.forEach(r => { h2hPts[r.team] = h ? h[r.team] : 0; });
  });
  list.sort((x, y) => (y.pts - x.pts) || (h2hPts[y.team] - h2hPts[x.team]) ||
    (y.diff - x.diff) || x.team.localeCompare(y.team));
  return list;
}

function renderStandings(){
  let html = "";
  ["A", "B"].forEach(pool => {
    const rows = computeStandings(pool);
    html += `<div class="ref-card"><h2>Pool ${pool}</h2>
      <div class="ref-sub">Top 2 advance to the Pool ${pool} final</div>
      <table class="standings-table">
        <thead><tr><th></th><th class="team-col">TEAM</th><th>GP</th><th>W</th><th>L</th><th>T</th><th>+/&minus;</th><th>PTS</th></tr></thead>
        <tbody>`;
    rows.forEach((r, i) => {
      const d = r.diff > 0 ? "+" + r.diff : r.diff < 0 ? "&minus;" + (-r.diff) : "0";
      html += `<tr class="${i < 2 && r.gp > 0 ? "final-spot" : ""}">
        <td class="rank"><span>${i + 1}</span></td><td class="team-col">${td(r.team)}</td>
        <td>${r.gp}</td><td>${r.w}</td><td>${r.l}</td><td>${r.t}</td><td>${d}</td><td class="pts">${r.pts}</td>
      </tr>`;
    });
    html += `</tbody></table></div>`;
  });
  html += `<div class="ref-note" style="margin:-4px 2px 14px;">Win = 2 pts, tie = 1. Ties in points are broken by head-to-head
    (if all tied teams played each other), then run differential capped at &plusmn;7 per game.
    Unofficial &mdash; the tournament organizers make the final call.</div>`;
  return html;
}

function render(){
  buildDayTabs();
  document.getElementById("dayTabsWrap").style.display = currentView === "__all__" ? "" : "none";
  const content = document.getElementById("content");
  if(currentView === "__all__"){
    content.innerHTML = renderMasterDay(currentDay);
  } else if(currentView === "__standings__"){
    content.innerHTML = renderStandings();
  } else if(currentView === "__menu__"){
    content.innerHTML = renderMenu();
  } else if(currentView === "__rules__"){
    content.innerHTML = renderRules();
  } else {
    content.innerHTML = renderTeamView(currentView);
  }
}

function init(){
  buildTeamSelect();
  render();

  document.getElementById("teamSelect").addEventListener("change", (e) => {
    currentView = e.target.value;
    render();
  });
}
init();
</script>
